apiVersion: v1
kind: Service

metadata:
  name: trips-api-service
  labels:
    app: trips-api

spec:
  type: {{ .Values.service.type }}

  selector:
    app: trips-api

  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    nodePort: {{ .Values.service.nodePort }}
    protocol: TCP