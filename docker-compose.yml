services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "V@pubgcod12"

    ports:
      - "1433:1433"

    volumes:
      - sql-data:/var/opt/mssql

  trips-api:
    build: .
    container_name: trips-api

    ports:
      - "8080:8080"

    environment:
      DB_SERVER: sqlserver
      DB_NAME: DockerTripsDb
      DB_USER: sa
      DB_PASSWORD: V@pubgcod12

    depends_on:
      - sqlserver

volumes:
  sql-data:
    external: true